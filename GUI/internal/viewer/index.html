<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 6-Face HDR Viewer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000;
        }
        canvas { 
            display: block; 
        }
    </style>
    
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js",
          "three/examples/jsm/loaders/HDRCubeTextureLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/HDRCubeTextureLoader.js"
        }
      }
    </script>
</head>
<body>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
        import { HDRCubeTextureLoader } from 'three/examples/jsm/loaders/HDRCubeTextureLoader.js';

        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0.1); // Stand inside the center

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // HDR Tone Mapping Setup
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0; 
        document.body.appendChild(renderer.domElement);

        // Controls to look around
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;  
        controls.enablePan = false;   
        controls.rotateSpeed = -0.5; // Natural drag direction

        // 2. Load the 6 Distinct HDR Faces
        // CRITICAL: Three.js requires the exact order: [ +X, -X, +Y, -Y, +Z, -Z ]
        const cubeFaceFiles = [
            'Px.hdr', // +X (Right)
            'Nx.hdr', // -X (Left)
            'Ny.hdr', // +Y (Top)
            'Py.hdr', // -Y (Bottom)
            'Pz.hdr', // +Z (Front)
            'Nz.hdr'  // -Z (Back)
        ];

        const hdrCubeLoader = new HDRCubeTextureLoader();

        // SET THE DIRECTORY PATH HERE (Make sure it ends with a slash /)
        hdrCubeLoader.setPath('./');

        // PASS THE ARRAY AS THE FIRST ARGUMENT
        hdrCubeLoader.load(
            cubeFaceFiles, 
            (cubeTexture) => {
                scene.background = cubeTexture;
                scene.environment = cubeTexture; 
                console.log('All 6 HDR faces loaded successfully!');
            }, 
            (xhr) => {
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            (error) => {
                console.error('An error occurred loading the cube faces:', error);
            }
        );

        // 3. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
